services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: imagnet:latest
    container_name: imagnet
    ports:
      - "${IMAGNET_PORT:-8080}:80"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 挂载 nginx 配置便于不改镜像直接调整（只读）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - imagnet-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  imagnet-net:
    driver: bridge
